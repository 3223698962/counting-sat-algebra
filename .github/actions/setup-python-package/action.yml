name: Setup counting-sat-algebra
description: Cache pip from pyproject.toml and install the package with dev extras. The job checks out the repo first so this local action is on disk.

inputs:
  python-version:
    description: CPython version to install
    required: true
    default: "3.12"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: pyproject.toml
    - name: Install the package and test dependencies
      shell: bash
      run: python -m pip install -e ".[dev]"

name: CI

# Pull requests and pushes to main only. A branch push that also opens a
# pull request used to start a second job for the same SHA.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

# actions: write is required to save the setup-python pip cache.
permissions:
  contents: read
  actions: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  gates:
    name: Architecture, docs, encoding, honesty
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install "ruff>=0.6,<1"
      - name: UTF-8 encoding
        run: python .github/workflows/check_encoding.py
      - name: Module size
        run: python .github/workflows/check_module_size.py
      - name: Doc sync
        run: python .github/workflows/check_doc_sync.py
      - name: Honesty flags
        run: python .github/workflows/check_honesty.py
      - name: Ruff
        run: python -m ruff check src tests .github
      - name: Ruff format on the reference package and gate scripts
        run: >-
          python -m ruff format --check
          src/counting_sat_algebra/reference_verify
          .github/workflows

  test:
    name: Python 3.12 pytest and verify --quick
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-package
        with:
          python-version: "3.12"
      - name: Run pytest
        run: python -m pytest -q
      - name: Run verify --quick
        run: |
          python -m counting_sat_algebra.verify --quick | tee "$RUNNER_TEMP/verify-quick.txt"
          python .github/workflows/check_verify_report.py quick "$RUNNER_TEMP/verify-quick.txt"

  python310:
    name: Python 3.10 fast tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-package
        with:
          python-version: "3.10"
      # Skip the side-length-256 scheduler point and the n=16384 placement
      # files. Python 3.12 already runs those in pytest and in verify --quick.
      - name: Run the fast pytest files
        run: |
          python -m pytest -q \
            --ignore=tests/test_step7_scheduler.py \
            --ignore=tests/test_step9_reference_design.py \
            --ignore=tests/test_step12_sparse_placement.py \
            --ignore=tests/test_step14_support_count.py \
            --ignore=tests/test_step16_asymptotic_family.py

  reference:
    name: verify --reference
    # The full report repeats the n=16384 placement and tensor checks that
    # verify --quick already runs on every pull request. Keep this job on
    # main, manual runs, and pull requests labeled run-reference.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
        contains(github.event.pull_request.labels.*.name, 'run-reference'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-package
        with:
          python-version: "3.12"
      - name: Run verify --reference and require a finite report
        run: |
          python -m counting_sat_algebra.verify --reference --output "$RUNNER_TEMP/reference.json" | tee "$RUNNER_TEMP/verify-reference.txt"
          python .github/workflows/check_verify_report.py quick "$RUNNER_TEMP/verify-reference.txt"
          python .github/workflows/check_verify_report.py reference "$RUNNER_TEMP/reference.json"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "counting-sat-algebra"
version = "0.2.0"
description = "Algebraic #SAT testbed: interpolation on small 3-CNFs and a bounded-occurrence checker. Does not refute ETH."
readme = "README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

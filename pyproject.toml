[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "counting-sat-algebra"
version = "0.30.0"
description = "Exact algebraic #SAT with Lean-guided streaming disjoint sparsification, scheduled sparse codes, violation-mass greedy selection, streamed high-variable loops, counting extension rings, streamed correction pairs, a pointwise streamed leaf and one assembled leaf run placing the ring constants, node tables and framed row stream at the recorded ports. The physical machine, grouping replacement and bit-complexity transfer remain open."
readme = "README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.6,<1"]

[project.scripts]
counting-sat-algebra = "counting_sat_algebra.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F"]

[tool.ruff.format]
quote-style = "single"

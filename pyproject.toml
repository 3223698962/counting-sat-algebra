[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "counting-sat-algebra"
version = "0.22.0"
description = "Exact algebraic #SAT reference implementation with finite Appendix D modular rings, CNF networks, tapered Hermite recovery, collision packing and child topologies, finite Section 5–6 sparse systems and equation selection, sparse placements and DIMACS counting. General modular recursion, theorem completion and asymptotic alignment remain open."
readme = "README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
counting-sat-algebra = "counting_sat_algebra.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

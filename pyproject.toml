[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "counting-sat-algebra"
version = "0.17.0"
description = "Exact algebraic #SAT reference implementation with a Lemma 4.8 parameter chooser, sparse placements, shared-measurement Taylor recovery, finite tensor contraction and DIMACS component counting. Complete theorem and asymptotic alignment remains open."
readme = "README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
counting-sat-algebra = "counting_sat_algebra.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
